[server]
headless = true
port = 8501
# Only this computer can open the dashboard. Change to "0.0.0.0" only if you
# deliberately want other devices on your network to reach it.
address = "localhost"
# MB. Only thumbnails (≤5 MB) go through Streamlit now — videos and documents
# go from the browser straight to storage (components/browser_upload).
maxUploadSize = 10
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Never show Python tracebacks in the browser.
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#2E7D32"
